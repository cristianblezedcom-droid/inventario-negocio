services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: almacen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: almacen
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U almacen -d almacen']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
